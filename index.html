<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyPath">
<meta name="theme-color" content="#0f2555">
<title>StudyPath</title>
<style>:root {
  --navy: #0f2555; --navy2: #1a3a7c; --gold: #c9a84c; --gold-ink: #8a6a1c;
  --bg: #f0f2f8; --surface: #ffffff; --surface2: #f6f7fb; --border: #dde2f0;
  --text: #0d1b3e; --text2: #4a5a7a; --muted: #7f8eab;
  --ok: #2e7d52; --ok-bg: #e8f5ee; --warn: #9a6200; --warn-bg: #fff6dc; --bad: #c0392b; --bad-bg: #fdecea;
  --code-bg: #e8eef8; --fs: 17px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Telugu", "Telugu Sangam MN", "Nirmala UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080e1f; --surface: #111827; --surface2: #162038; --border: #22314f;
    --text: #e8edf8; --text2: #aab6cf; --muted: #7584a3; --gold-ink: #e3c76f;
    --ok-bg: #143322; --warn: #f0c060; --warn-bg: #3a2c0a; --bad-bg: #3d1a1a; --code-bg: #1e3a6e;
  }
}
:root[data-theme="dark"] {
  --bg: #080e1f; --surface: #111827; --surface2: #162038; --border: #22314f;
  --text: #e8edf8; --text2: #aab6cf; --muted: #7584a3; --gold-ink: #e3c76f;
  --ok-bg: #143322; --warn: #f0c060; --warn-bg: #3a2c0a; --bad-bg: #3d1a1a; --code-bg: #1e3a6e;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs); line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--navy); color: #fff; }
.brand { font-weight: 800; font-size: 19px; text-decoration: none; white-space: nowrap; letter-spacing: .2px; }
.brand span { color: var(--gold); }
.iconbtn { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 10px; min-width: 38px; height: 38px; padding: 0 10px; cursor: pointer; font-size: 15px; }
.iconbtn:hover { background: rgba(255,255,255,.22); }
#menuBtn { display: none; }
.search { flex: 1; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 0; padding: 0 12px; font-size: 15px; background: rgba(255,255,255,.95); color: #0d1b3e; }

/* layout */
.layout { display: flex; min-height: calc(100vh - 54px); }
.sidebar { width: 310px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto; padding: 10px 0 40px; font-size: 14.5px; }
.main { flex: 1; min-width: 0; padding: 22px clamp(16px, 4vw, 48px) 80px; outline: none; }
.main > .inner { max-width: 820px; margin: 0 auto; }
.scrim { display: none; }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; height: 100%; z-index: 50; transform: translateX(-105%);
    transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.3); padding-top: max(10px, env(safe-area-inset-top)); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(5,10,25,.45); }
  .brand { font-size: 17px; }
  #fontDown, #fontUp { display: none; }
}

/* sidebar tree */
.sem { padding: 10px 16px 4px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.subj > summary { list-style: none; cursor: pointer; padding: 8px 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.subj > summary::-webkit-details-marker { display: none; }
.subj > summary::before { content: "▸"; color: var(--muted); font-size: 12px; width: 10px; }
.subj[open] > summary::before { content: "▾"; }
.subj > summary .pct { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
.unit { padding: 8px 16px 2px 34px; font-size: 11px; font-weight: 700; color: var(--gold-ink); text-transform: uppercase; letter-spacing: .5px; }
.navlink { display: flex; gap: 8px; align-items: baseline; padding: 5px 14px 5px 34px; text-decoration: none; color: var(--text2); border-left: 3px solid transparent; }
.navlink:hover { background: var(--surface2); color: var(--text); }
.navlink.active { background: var(--surface2); color: var(--text); border-left-color: var(--gold); font-weight: 600; }
.navlink.empty { opacity: .45; }
.navlink .tick { width: 14px; flex-shrink: 0; color: var(--ok); font-weight: 800; }
.navlink.special { font-weight: 600; color: var(--text); }

/* content */
h1.title { font-size: 1.6em; line-height: 1.25; margin: 4px 0 6px; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb a { text-decoration: none; color: var(--gold-ink); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 18px; }
.tab { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--text2); text-decoration: none; }
.tab.on { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
:root[data-theme="dark"] .tab.on { background: var(--gold); border-color: var(--gold); color: #0f2555; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab.on { background: var(--gold); border-color: var(--gold); color: #0f2555; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin: 0 0 12px; }
.md { overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.3em 0 .45em; }
.md h1 { font-size: 1.4em; } .md h2 { font-size: 1.22em; color: var(--navy2); } .md h3 { font-size: 1.07em; } .md h4 { font-size: 1em; }
:root[data-theme="dark"] .md h2 { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .md h2 { color: var(--gold); } }
.md > :first-child { margin-top: 0; }
.md p { margin: .6em 0; }
.md ul, .md ol { padding-left: 1.4em; margin: .5em 0; }
.md li { margin: .25em 0; }
.md strong { color: var(--gold-ink); }
.md code { background: var(--code-bg); border-radius: 4px; padding: 0 4px; font-size: .9em; }
.md blockquote { margin: .8em 0; padding: .4em 1em; border-left: 3px solid var(--gold); background: var(--surface2); border-radius: 0 8px 8px 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1.4em 0; }
.md table { border-collapse: collapse; width: 100%; margin: .8em 0; font-size: .92em; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface2); }
.md a.xref { color: var(--gold-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 0; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #0f2555; }
.btn.done { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.btn:disabled { opacity: .4; cursor: default; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; }
.pager a { flex: 1; max-width: 48%; }
.pager .next { text-align: right; justify-content: flex-end; }
.pager small { display: block; color: var(--muted); font-weight: 500; }

/* home */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.subjcard { text-decoration: none; display: block; }
.subjcard h3 { margin: 0 0 4px; font-size: 1.05em; }
.bar { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; background: var(--gold); }
.meta { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .4px; padding: 2px 8px; border-radius: 8px; background: var(--surface2); color: var(--text2); }
.pill.long { background: rgba(26,58,124,.14); color: var(--navy2); }
.pill.short { background: rgba(201,168,76,.2); color: var(--gold-ink); }
:root[data-theme="dark"] .pill.long { color: #9fb8f0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.long { color: #9fb8f0; } }

/* answers */
.qa > summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.qa > summary::-webkit-details-marker { display: none; }
.qa > summary .q { flex: 1; font-weight: 600; }
.qa > summary .chev { color: var(--muted); }
.qa[open] > summary .chev { transform: rotate(90deg); }
.qa .topic { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 400; }
.qa .body { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.warnbox { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13.5px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--gold); color: #0f2555; font-weight: 700; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 16px; }

/* quiz / viva / revision */
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); padding: 10px 14px; border-radius: 10px; margin: 8px 0; cursor: pointer; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.explain { background: var(--surface2); border-radius: 10px; padding: 10px 14px; margin-top: 8px; font-size: .95em; }
.revrow { display: grid; grid-template-columns: minmax(110px, 1fr) 2fr; gap: 4px 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.revrow b { color: var(--gold-ink); }
.revrow .hook { grid-column: 2; color: var(--muted); font-style: italic; font-size: .93em; }
.flash { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: pointer; font-size: 1.15em; }
.flash .hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
.reveal { margin-top: 10px; }
.reveal.hidden .ans { display: none; }

.empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }
.hit { padding: 12px 0; border-bottom: 1px solid var(--border); }
.hit a { font-weight: 700; text-decoration: none; }
.hit .snip { font-size: 14px; color: var(--text2); }
mark { background: #fff1a8; color: #0d1b3e; border-radius: 3px; padding: 0 2px; }
.gl-term { font-weight: 700; }
.gl-te { color: var(--gold-ink); }

@media print {
  .topbar, .sidebar, .tabs, .btnrow, .pager, .toolbar { display: none !important; }
  .main { padding: 0; }
  .qa .body { display: block !important; }
  .card { border: 0; padding: 0; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open contents">☰</button>
  <a class="brand" href="#/">Study<span>Path</span></a>
  <form class="search" id="searchForm" role="search">
    <input id="searchBox" type="search" placeholder="Search topics, sections, cases…" autocomplete="off">
  </form>
  <button class="iconbtn" id="fontDown" aria-label="Smaller text">A−</button>
  <button class="iconbtn" id="fontUp" aria-label="Larger text">A+</button>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Syllabus"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script>window.SP_MODE="folder";</script><script src="data/manifest.js"></script>
<script>(function () {
  'use strict';

  var D = window.SP_DATA;
  var main = document.getElementById('main');
  if (!D || !D.manifest) {
    main.innerHTML = '<div class="inner empty-state"><h2>No data found</h2><p>The <code>data/</code> folder must sit next to this index.html. Rebuild with <code>npx tsx buildWebReader.ts</code>.</p></div>';
    return;
  }
  var M = D.manifest;
  var TYPE_LABEL = {};
  M.types.forEach(function (t) { TYPE_LABEL[t[0]] = t[1]; });

  // ---------------------------------------------------------------- storage
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('sp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('sp_' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  };
  var done = store.get('done', {});

  // ---------------------------------------------------------------- indexes
  var SUBJ = {}, CH = {};
  M.semesters.forEach(function (sem) {
    sem.subjects.forEach(function (s) {
      SUBJ[s.id] = { s: s, sem: sem };
      s.chapters.forEach(function (c, i) { CH[c.id] = { c: c, s: s, sem: sem, i: i }; });
    });
  });

  // ---------------------------------------------------------------- data loading
  var waiters = {};
  window.SP_LOADED = function (id) { (waiters[id] || []).forEach(function (w) { w[0](D.subjects[id]); }); delete waiters[id]; };

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function loadSubject(id) {
    if (D.subjects[id]) return Promise.resolve(D.subjects[id]);
    if (window.SP_MODE === 'single') {
      var el = document.getElementById('sp-gz-' + id);
      if (!el) return Promise.reject(new Error('No data for ' + id));
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('This browser is too old to open the single-file version. Update Safari/Chrome, or use the folder version.'));
      var stream = new Blob([b64ToBytes(el.textContent.trim())]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text().then(function (t) { D.subjects[id] = JSON.parse(t); return D.subjects[id]; });
    }
    return new Promise(function (resolve, reject) {
      if (waiters[id]) { waiters[id].push([resolve, reject]); return; }
      waiters[id] = [[resolve, reject]];
      var sc = document.createElement('script');
      sc.src = 'data/' + encodeURIComponent(id) + '.js';
      sc.onerror = function () {
        (waiters[id] || []).forEach(function (w) { w[1](new Error('Could not load data/' + id + '.js')); });
        delete waiters[id];
      };
      document.head.appendChild(sc);
    });
  }
  function loadAll() { return Promise.all(Object.keys(SUBJ).map(loadSubject)); }

  // ---------------------------------------------------------------- markdown
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function linkFor(text, url) {
    var m;
    if ((m = /^chapter:\/\/(.+)$/.exec(url))) return '<a class="xref" href="#/c/' + m[1] + '">' + text + '</a>';
    if ((m = /^search:\/\/(.+)$/.exec(url))) return '<a class="xref" href="#/search/' + m[1] + '">' + text + '</a>';
    if (/^https?:\/\//.test(url)) return '<a class="xref" href="' + url + '" target="_blank" rel="noopener">' + text + '</a>';
    return text;
  }

  function inline(s) {
    var codes = [];
    s = esc(s).replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) { return linkFor(t, u.replace(/&amp;/g, '&')); });
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
    return s;
  }

  function md(src) {
    var lines = String(src || '').replace(/<\!--[\s\S]*?-->/g, '').replace(/\r/g, '').split('\n');
    var out = [], para = [], list = null, quote = [];
    function flushPara() { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
    function flushList() { if (list) { out.push('<' + list.t + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; } }
    function flushQuote() { if (quote.length) { out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; } }
    function flush() { flushPara(); flushList(); flushQuote(); }
    var isRow = function (l) { return /^\s*\|.*\|\s*$/.test(l); };
    var isSep = function (l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l); };
    var cells = function (l) { return l.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };

    for (var i = 0; i < lines.length; i++) {
      var l = lines[i], m;
      if (!l.trim()) { flush(); continue; }
      if (isRow(l) && i + 1 < lines.length && isSep(lines[i + 1])) {
        flush();
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isRow(lines[i])) { rows.push(cells(lines[i])); i++; }
        i--;
        out.push('<table><thead><tr>' + head.map(function (h) { return '<th>' + inline(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
        continue;
      }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { flush(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }
      if (/^\s*(?:(?:-\s*){3,}|(?:\*\s*){3,}|(?:_\s*){3,})$/.test(l)) { flush(); out.push('<hr>'); continue; }
      if ((m = /^\s*>\s?(.*)$/.exec(l))) { flushPara(); flushList(); quote.push(m[1]); continue; }
      if ((m = /^\s*[-*•]\s+(.*)$/.exec(l))) { flushPara(); flushQuote(); if (!list || list.t !== 'ul') { flushList(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))) { flushPara(); flushQuote(); if (!list || list.t !== 'ol') { flushList(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      if (list && /^\s{2,}\S/.test(l)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
      flushList(); flushQuote();
      para.push(l);
    }
    flush();
    return '<div class="md">' + out.join('\n') + '</div>';
  }

  // ---------------------------------------------------------------- settings
  var root = document.documentElement;
  function applyTheme() { var t = store.get('theme', 'auto'); if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t); }
  function applyFont() { root.style.setProperty('--fs', store.get('fs', 17) + 'px'); }
  applyTheme(); applyFont();
  document.getElementById('themeBtn').onclick = function () {
    var order = ['auto', 'light', 'dark'], cur = store.get('theme', 'auto');
    store.set('theme', order[(order.indexOf(cur) + 1) % 3]); applyTheme();
  };
  document.getElementById('fontUp').onclick = function () { store.set('fs', Math.min(26, store.get('fs', 17) + 1)); applyFont(); };
  document.getElementById('fontDown').onclick = function () { store.set('fs', Math.max(13, store.get('fs', 17) - 1)); applyFont(); };
  document.getElementById('menuBtn').onclick = function () { document.body.classList.toggle('nav-open'); };
  document.getElementById('scrim').onclick = function () { document.body.classList.remove('nav-open'); };
  document.getElementById('searchForm').onsubmit = function (e) {
    e.preventDefault();
    var q = document.getElementById('searchBox').value.trim();
    if (q) location.hash = '#/search/' + encodeURIComponent(q);
  };

  // ---------------------------------------------------------------- helpers
  function subjectProgress(s) {
    var withContent = s.chapters.filter(function (c) { return c.has.length; });
    var d = withContent.filter(function (c) { return done[c.id]; }).length;
    return { done: d, total: withContent.length, pct: withContent.length ? Math.round(100 * d / withContent.length) : 0 };
  }
  function shortName(s) { return s.name.split(',')[0]; }
  function view(html) { main.innerHTML = '<div class="inner">' + html + '</div>'; }
  function loading() { view('<div class="empty-state">Loading…</div>'); }
  function fail(e) { view('<div class="empty-state"><h2>Could not open this</h2><p>' + esc(e.message || e) + '</p></div>'); }

  // ---------------------------------------------------------------- sidebar
  var current = { subject: null, chapter: null, route: '' };
  function renderSidebar() {
    var h = [];
    M.semesters.forEach(function (sem) {
      h.push('<div class="sem">' + esc(sem.name) + '</div>');
      sem.subjects.forEach(function (s) {
        var p = subjectProgress(s), open = current.subject === s.id;
        h.push('<details class="subj"' + (open ? ' open' : '') + '><summary>' + esc(shortName(s)) + '<span class="pct">' + p.done + '/' + p.total + '</span></summary>');
        h.push('<a class="navlink special' + (current.route === 'subject' && open ? ' active' : '') + '" href="#/s/' + s.id + '"><span class="tick">≡</span>Overview</a>');
        var nAns = s.papers.reduce(function (a, p) { return a + p.count; }, 0);
        if (nAns) h.push('<a class="navlink special' + (current.route === 'answers' && open ? ' active' : '') + '" href="#/a/' + s.id + '"><span class="tick">✎</span>Model answers (' + nAns + ')</a>');
        if (s.glossaryCount) h.push('<a class="navlink special' + (current.route === 'glossary' && open ? ' active' : '') + '" href="#/g/' + s.id + '"><span class="tick">A</span>Glossary</a>');
        var lastUnit = null;
        s.chapters.forEach(function (c) {
          if (c.unit !== lastUnit) { lastUnit = c.unit; if (c.unit) h.push('<div class="unit">' + esc(c.unit) + '</div>'); }
          h.push('<a class="navlink' + (c.has.length ? '' : ' empty') + (current.chapter === c.id ? ' active' : '') + '" href="#/c/' + c.id + '"><span class="tick">' + (done[c.id] ? '✓' : '') + '</span>' + esc(c.name) + '</a>');
        });
        h.push('</details>');
      });
    });
    var sb = document.getElementById('sidebar');
    var keep = sb.scrollTop;
    sb.innerHTML = h.join('');
    sb.scrollTop = keep;
    var act = sb.querySelector('.navlink.active');
    if (act && (act.offsetTop < sb.scrollTop || act.offsetTop > sb.scrollTop + sb.clientHeight - 40)) sb.scrollTop = act.offsetTop - 120;
  }

  // ---------------------------------------------------------------- views
  function homeView() {
    current = { subject: null, chapter: null, route: 'home' };
    var last = store.get('last', null), h = [];
    h.push('<h1 class="title">StudyPath</h1><div class="crumb">Content built ' + esc((M.generatedAt || '').slice(0, 10)) + ' · works offline</div>');
    if (last && CH[last]) h.push('<div class="btnrow"><a class="btn primary" href="#/c/' + last + '">Continue: ' + esc(CH[last].c.name) + ' →</a></div>');
    M.semesters.forEach(function (sem) {
      h.push('<h2 style="margin-top:28px">' + esc(sem.name) + '</h2><div class="grid">');
      sem.subjects.forEach(function (s) {
        var p = subjectProgress(s), nAns = s.papers.reduce(function (a, x) { return a + x.count; }, 0);
        h.push('<a class="card subjcard" href="#/s/' + s.id + '"><h3>' + esc(shortName(s)) + '</h3><div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
          '<div class="meta">' + p.done + ' of ' + p.total + ' chapters done' + (nAns ? ' · ' + nAns + ' model answers' : '') + '</div></a>');
      });
      h.push('</div>');
    });
    view(h.join(''));
  }

  function subjectView(sid) {
    var S = SUBJ[sid]; if (!S) return notFound();
    var s = S.s;
    current = { subject: sid, chapter: null, route: 'subject' };
    var p = subjectProgress(s), h = [];
    h.push('<div class="crumb"><a href="#/">Home</a> › ' + esc(S.sem.name) + '</div><h1 class="title">' + esc(s.name) + '</h1>');
    h.push('<div class="bar"><i style="width:' + p.pct + '%"></i></div><div class="meta">' + p.done + ' of ' + p.total + ' chapters done</div>');
    h.push('<div class="btnrow">');
    s.papers.forEach(function (pp) { h.push('<a class="btn primary" href="#/a/' + sid + '/' + encodeURIComponent(pp.paperId) + '">✎ ' + esc(pp.title) + ' (' + pp.count + ')</a>'); });
    if (s.glossaryCount) h.push('<a class="btn" href="#/g/' + sid + '">Glossary (' + s.glossaryCount + ')</a>');
    h.push('</div>');
    var lastUnit = null;
    s.chapters.forEach(function (c) {
      if (c.unit !== lastUnit) { if (lastUnit !== null) h.push('</div>'); lastUnit = c.unit; h.push('<h3 style="margin-top:24px">' + esc(c.unit || 'Chapters') + '</h3><div class="card" style="padding:4px 0">'); }
      h.push('<a class="navlink' + (c.has.length ? '' : ' empty') + '" style="padding-left:16px" href="#/c/' + c.id + '"><span class="tick">' + (done[c.id] ? '✓' : '') + '</span>' + esc(c.name) + '</a>');
    });
    if (lastUnit !== null) h.push('</div>');
    view(h.join(''));
  }

  function chapterView(cid, type) {
    var C = CH[cid]; if (!C) return notFound();
    current = { subject: C.s.id, chapter: cid, route: 'chapter' };
    store.set('last', cid);
    renderSidebar();
    loading();
    loadSubject(C.s.id).then(function (data) {
      var content = (data.chapters[cid]) || {};
      var types = M.types.map(function (t) { return t[0]; }).filter(function (k) { return content[k]; });
      if (!type || !content[type]) type = store.get('tab', 'notes');
      if (!content[type]) type = types[0];
      var h = [];
      h.push('<div class="crumb"><a href="#/s/' + C.s.id + '">' + esc(shortName(C.s)) + '</a>' + (C.c.unit ? ' › ' + esc(C.c.unit) : '') + '</div>');
      h.push('<h1 class="title">' + esc(C.c.name) + '</h1>');
      if (!types.length) {
        h.push('<div class="empty-state">No content generated for this chapter yet.</div>');
      } else {
        h.push('<div class="tabs">' + types.map(function (k) {
          return '<a class="tab' + (k === type ? ' on' : '') + '" href="#/c/' + cid + '/' + k + '">' + esc(TYPE_LABEL[k] || k) + '</a>';
        }).join('') + '</div>');
        h.push('<div id="tabBody">' + renderType(type, content[type]) + '</div>');
        h.push('<div class="btnrow"><button class="btn' + (done[cid] ? ' done' : '') + '" id="doneBtn">' + (done[cid] ? '✓ Done' : 'Mark chapter done') + '</button></div>');
      }
      var prev = C.s.chapters[C.i - 1], next = C.s.chapters[C.i + 1];
      h.push('<div class="pager">' +
        (prev ? '<a class="btn" href="#/c/' + prev.id + '">← <span><small>Previous</small>' + esc(prev.name) + '</span></a>' : '<span></span>') +
        (next ? '<a class="btn next" href="#/c/' + next.id + '"><span><small>Next</small>' + esc(next.name) + '</span> →</a>' : '<span></span>') + '</div>');
      view(h.join(''));
      if (type) store.set('tab', type);
      var db = document.getElementById('doneBtn');
      if (db) db.onclick = function () {
        if (done[cid]) delete done[cid]; else done[cid] = 1;
        store.set('done', done);
        db.className = 'btn' + (done[cid] ? ' done' : '');
        db.textContent = done[cid] ? '✓ Done' : 'Mark chapter done';
        renderSidebar();
      };
      wireType(type, content[type]);
    }).catch(fail);
  }

  // ---- per-type renderers
  function renderType(type, v) {
    if (type === 'vivaQA') return v.map(function (q, i) {
      return '<div class="card"><div class="pill">Q' + (i + 1) + '</div><div style="font-weight:600;margin:8px 0">' + esc(q.question || '') + '</div>' +
        '<div class="reveal hidden"><button class="btn" data-reveal>Show answer</button><div class="ans md" style="margin-top:10px">' + inline(q.answer || '') + '</div></div></div>';
    }).join('');
    if (type === 'quiz') return '<div class="meta" id="quizScore">Answer each question — score updates as you go.</div>' + v.map(function (q, i) {
      return '<div class="card" data-q="' + i + '"><div class="pill">Q' + (i + 1) + '</div><div style="font-weight:600;margin:8px 0">' + esc(q.question || '') + '</div>' +
        (q.options || []).map(function (o, j) { return '<button class="opt" data-o="' + j + '">' + esc(o) + '</button>'; }).join('') +
        '<div class="explain" hidden>' + inline(q.explanation || '') + '</div></div>';
    }).join('');
    if (type === 'dailyRevision') {
      var cards = revisionCards(v);
      return (cards.length ? '<div class="toolbar"><button class="btn primary" id="flashBtn">🗂 Flashcards (' + cards.length + ')</button></div><div id="flashArea"></div>' : '') +
        '<div class="card">' + renderRevision(v) + '</div>';
    }
    return '<div class="card">' + md(v) + '</div>';
  }

  function revisionCards(v) {
    return String(v).split('\n').map(function (l) { return l.replace(/^\s*[-*•]\s*/, ''); })
      .filter(function (l) { return l.split('|').length >= 2; })
      .map(function (l) { var p = l.split('|').map(function (x) { return x.trim(); }); return { front: p[0], back: p[1], hook: p[2] || '' }; });
  }
  function renderRevision(v) {
    var out = [], buf = [];
    function flushBuf() { if (buf.length) { out.push(md(buf.join('\n'))); buf = []; } }
    String(v).split('\n').forEach(function (l) {
      var t = l.replace(/^\s*[-*•]\s*/, '');
      if (t.split('|').length >= 2) {
        flushBuf();
        var p = t.split('|').map(function (x) { return x.trim(); });
        out.push('<div class="revrow"><b>' + inline(p[0]) + '</b><span>' + inline(p[1]) + '</span>' + (p[2] ? '<span class="hook">🪝 ' + inline(p.slice(2).join(' | ')) + '</span>' : '') + '</div>');
      } else buf.push(l);
    });
    flushBuf();
    return out.join('');
  }

  function wireType(type, v) {
    var body = document.getElementById('tabBody'); if (!body) return;
    body.querySelectorAll('[data-reveal]').forEach(function (b) {
      b.onclick = function () { b.parentNode.classList.remove('hidden'); b.remove(); };
    });
    if (type === 'quiz') {
      var right = 0, answered = 0;
      body.querySelectorAll('[data-q]').forEach(function (card) {
        var q = v[+card.getAttribute('data-q')];
        var corr = q.correct;
        if (typeof corr === 'string') corr = /^[A-Da-d]$/.test(corr) ? corr.toUpperCase().charCodeAt(0) - 65 : (q.options || []).indexOf(corr);
        q = Object.assign({}, q, { correct: corr });
        card.querySelectorAll('.opt').forEach(function (btn) {
          btn.onclick = function () {
            if (card.dataset.done) return;
            card.dataset.done = '1'; answered++;
            var pick = +btn.getAttribute('data-o');
            if (pick === q.correct) right++;
            card.querySelectorAll('.opt').forEach(function (o) {
              var j = +o.getAttribute('data-o');
              if (j === q.correct) o.classList.add('right'); else if (j === pick) o.classList.add('wrong');
            });
            var ex = card.querySelector('.explain'); if (ex && q.explanation) ex.hidden = false;
            document.getElementById('quizScore').textContent = 'Score: ' + right + ' / ' + answered + (answered === v.length ? ' — finished (' + Math.round(100 * right / v.length) + '%)' : '');
          };
        });
      });
    }
    if (type === 'dailyRevision') {
      var fb = document.getElementById('flashBtn'); if (!fb) return;
      fb.onclick = function () {
        var cards = revisionCards(v).sort(function () { return Math.random() - 0.5; }), i = 0, flipped = false;
        var area = document.getElementById('flashArea');
        function show() {
          var c = cards[i];
          area.innerHTML = '<div class="card flash" id="flashCard">' + (flipped
            ? '<div><b>' + inline(c.front) + '</b></div><div style="margin-top:10px">' + inline(c.back) + '</div>' + (c.hook ? '<div class="hint">🪝 ' + inline(c.hook) + '</div>' : '')
            : '<div><b>' + inline(c.front) + '</b></div><div class="hint">Say it aloud, then tap to check</div>') +
            '</div><div class="toolbar"><button class="btn" id="fPrev">←</button><span class="meta">' + (i + 1) + ' / ' + cards.length + '</span><button class="btn" id="fNext">→</button><button class="btn" id="fClose">Close</button></div>';
          document.getElementById('flashCard').onclick = function () { flipped = !flipped; show(); };
          document.getElementById('fPrev').onclick = function () { i = (i - 1 + cards.length) % cards.length; flipped = false; show(); };
          document.getElementById('fNext').onclick = function () { i = (i + 1) % cards.length; flipped = false; show(); };
          document.getElementById('fClose').onclick = function () { area.innerHTML = ''; };
        }
        show();
        area.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }
  }

  // ---- model answers
  function answersView(sid, paperId) {
    var S = SUBJ[sid]; if (!S) return notFound();
    current = { subject: sid, chapter: null, route: 'answers' };
    renderSidebar();
    loading();
    loadSubject(sid).then(function (data) {
      var papers = data.papers || [];
      if (!papers.length) return view('<div class="empty-state">No model answers for this subject yet.<br>Run <code>answerQuestionPaper.ts</code> on a question paper.</div>');
      var paper = papers.filter(function (p) { return p.paperId === paperId; })[0] || (papers.length === 1 ? papers[0] : null);
      var h = ['<div class="crumb"><a href="#/s/' + sid + '">' + esc(shortName(S.s)) + '</a> › Model answers</div>'];
      if (!paper) {
        h.push('<h1 class="title">Model answers</h1>');
        papers.forEach(function (p) { h.push('<a class="card subjcard" href="#/a/' + sid + '/' + encodeURIComponent(p.paperId) + '"><h3>' + esc(p.title) + '</h3><div class="meta">' + p.answers.length + ' questions · ' + esc(p.sourceNote) + '</div></a>'); });
        return view(h.join(''));
      }
      h.push('<h1 class="title">' + esc(paper.title) + '</h1><div class="meta">' + esc(S.s.name) + ' · ' + paper.answers.length + ' questions · source: ' + esc(paper.sourceNote) + '</div>');
      h.push('<div class="toolbar"><button class="btn" id="expandAll">Expand all</button><button class="btn" id="collapseAll">Practice mode (hide answers)</button><button class="btn" id="printBtn">Print / PDF</button></div>');
      h.push('<p class="meta">Practice: read the question, write or say your answer, then open it to compare. Answers follow the structure examiners reward — definition with section number, numbered points, cases, conclusion — plus how to write it for full marks.</p>');
      var lastPart = null;
      paper.answers.forEach(function (a, i) {
        if (a.part && a.part !== lastPart) { lastPart = a.part; h.push('<h2 style="margin-top:26px">' + esc(a.part) + '</h2>'); }
        var long = a.marks === 'long';
        h.push('<details class="card qa" data-i="' + i + '"><summary><div class="q">' +
          '<span class="pill ' + (long ? 'long' : 'short') + '">' + (long ? 'LONG' : 'SHORT') + '</span> ' +
          (a.marksValue ? '<span class="pill">' + a.marksValue + ' marks</span> ' : '') +
          '<div style="margin-top:6px">' + esc(a.question) + '</div>' +
          (a.chapterIds && a.chapterIds.length ? '<div class="topic">📖 ' + a.chapterIds.map(function (id, j) {
            return CH[id] ? '<a class="xref" href="#/c/' + id + '" onclick="event.stopPropagation()">' + esc(CH[id].c.name) + '</a>' : esc((a.chapterNames || [])[j] || id);
          }).join(' · ') + '</div>' : '') +
          '</div><span class="chev">›</span></summary><div class="body">' +
          (a.answerTE ? '<div class="seg"><button class="on" data-lang="en">English</button><button data-lang="te">తెలుగు</button></div>' : '') +
          '<div class="ansText">' + md(a.answer) + '</div>' +
          (a.warnings && a.warnings.length ? '<div class="warnbox">⚠ Check before relying on it: ' + a.warnings.map(esc).join(' · ') + '</div>' : '') +
          '</div></details>');
      });
      view(h.join(''));
      var all = main.querySelectorAll('details.qa');
      document.getElementById('expandAll').onclick = function () { all.forEach(function (d) { d.open = true; }); };
      document.getElementById('collapseAll').onclick = function () { all.forEach(function (d) { d.open = false; }); };
      document.getElementById('printBtn').onclick = function () { all.forEach(function (d) { d.open = true; }); window.print(); };
      main.querySelectorAll('.seg button').forEach(function (b) {
        b.onclick = function () {
          var det = b.closest('details'), a = paper.answers[+det.getAttribute('data-i')];
          det.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
          det.querySelector('.ansText').innerHTML = md(b.getAttribute('data-lang') === 'te' ? a.answerTE : a.answer);
        };
      });
    }).catch(fail);
  }

  function glossaryView(sid) {
    var S = SUBJ[sid]; if (!S) return notFound();
    current = { subject: sid, chapter: null, route: 'glossary' };
    renderSidebar();
    loading();
    loadSubject(sid).then(function (data) {
      var terms = (data.glossary || []).slice().sort(function (a, b) { return a.term_en.localeCompare(b.term_en); });
      view('<div class="crumb"><a href="#/s/' + sid + '">' + esc(shortName(S.s)) + '</a> › Glossary</div><h1 class="title">Glossary</h1>' +
        terms.map(function (t) {
          return '<div class="card"><div class="gl-term">' + esc(t.term_en) + (t.term_te ? ' · <span class="gl-te">' + esc(t.term_te) + '</span>' : '') + '</div>' +
            '<div>' + inline(t.definition_en || '') + '</div>' + (t.definition_te ? '<div class="gl-te">' + inline(t.definition_te) + '</div>' : '') +
            (t.example ? '<div class="meta">e.g. ' + inline(t.example) + '</div>' : '') + '</div>';
        }).join(''));
    }).catch(fail);
  }

  // ---- search
  function snippet(text, q) {
    var plain = String(text).replace(/<\!--[\s\S]*?-->/g, '').replace(/[#*`>|]/g, ' ').replace(/\s+/g, ' ');
    var i = plain.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return null;
    var s = Math.max(0, i - 70), part = plain.slice(s, i + q.length + 110);
    var e = esc(part), re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
    return (s ? '…' : '') + e.replace(re, function (x) { return '<mark>' + x + '</mark>'; }) + '…';
  }

  function searchView(q) {
    current = { subject: null, chapter: null, route: 'search' };
    document.getElementById('searchBox').value = q;
    var ql = q.toLowerCase(), h = ['<h1 class="title">Search: ' + esc(q) + '</h1>'];
    var names = Object.keys(CH).filter(function (id) { return CH[id].c.name.toLowerCase().indexOf(ql) >= 0; });
    h.push('<h3>Topics</h3>');
    h.push(names.length ? names.slice(0, 40).map(function (id) {
      return '<div class="hit"><a href="#/c/' + id + '">' + esc(CH[id].c.name) + '</a><div class="meta">' + esc(shortName(CH[id].s)) + '</div></div>';
    }).join('') : '<p class="meta">No topic names match.</p>');
    h.push('<h3 style="margin-top:26px">Inside notes and answers</h3><div id="deep" class="meta">Searching…</div>');
    view(h.join(''));
    loadAll().then(function () {
      var hits = [];
      Object.keys(SUBJ).forEach(function (sid) {
        var data = D.subjects[sid]; if (!data) return;
        Object.keys(data.chapters).forEach(function (cid) {
          var c = data.chapters[cid];
          for (var k in c) {
            if (typeof c[k] !== 'string') continue;
            var sn = snippet(c[k], q);
            if (sn) { hits.push('<div class="hit"><a href="#/c/' + cid + '/' + k + '">' + esc(CH[cid] ? CH[cid].c.name : cid) + '</a> <span class="pill">' + esc(TYPE_LABEL[k] || k) + '</span><div class="snip">' + sn + '</div></div>'); break; }
          }
        });
        (data.papers || []).forEach(function (p) {
          p.answers.forEach(function (a) {
            var sn = snippet(a.question + ' — ' + a.answer, q);
            if (sn) hits.push('<div class="hit"><a href="#/a/' + sid + '/' + encodeURIComponent(p.paperId) + '">' + esc(a.question) + '</a> <span class="pill">Model answer</span><div class="snip">' + sn + '</div></div>');
          });
        });
      });
      var el = document.getElementById('deep');
      if (el) el.outerHTML = hits.length ? hits.slice(0, 80).join('') + (hits.length > 80 ? '<p class="meta">Showing 80 of ' + hits.length + '. Narrow the search.</p>' : '') : '<p class="meta">Nothing found.</p>';
    }).catch(fail);
  }

  function notFound() { view('<div class="empty-state"><h2>Not found</h2><p><a href="#/">Go home</a></p></div>'); }

  // ---------------------------------------------------------------- router
  function route() {
    document.body.classList.remove('nav-open');
    var parts = location.hash.replace(/^#\/?/, '').split('/').map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    var r = parts[0];
    if (r === 'c') chapterView(parts[1], parts[2]);
    else if (r === 's') subjectView(parts[1]);
    else if (r === 'a') answersView(parts[1], parts[2]);
    else if (r === 'g') glossaryView(parts[1]);
    else if (r === 'search') searchView(parts.slice(1).join('/'));
    else homeView();
    renderSidebar();
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
